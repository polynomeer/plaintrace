name: Portability baseline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
        python: ['3.10', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, resolved 2026-10-27
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build wheel
        run: |
          python -m pip install build==1.6.1
          python -m build --wheel --outdir "${{ runner.temp }}/plaintrace-wheel"
      - name: Install wheel with EVTX extra
        run: |
          python -c "import os,pathlib,subprocess,sys; wheel=next((pathlib.Path(os.environ['RUNNER_TEMP'])/'plaintrace-wheel').glob('*.whl')); subprocess.check_call([sys.executable,'-m','pip','install',str(wheel)+'[evtx]'])"
          python -m pip check
      - name: Validate support inventory
        run: python tools/portability.py validate
      - name: Full suite without skips
        run: python tools/portability.py suite --output "${{ runner.temp }}/plaintrace-suite"
      - name: Installed wheel outside checkout
        run: python -c "import os,pathlib,subprocess,sys; temp=pathlib.Path(os.environ['RUNNER_TEMP']); wheel=next((temp/'plaintrace-wheel').glob('*.whl')); subprocess.check_call([sys.executable,'-I',str(pathlib.Path(os.environ['GITHUB_WORKSPACE'])/'tools'/'portability.py'),'smoke','--wheel',str(wheel),'--output',str(temp/'plaintrace-smoke')],cwd=temp)"
      - name: Preserve generated validation records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: portability-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            ${{ runner.temp }}/plaintrace-suite/
            ${{ runner.temp }}/plaintrace-smoke/
          if-no-files-found: error
          retention-days: 14

  static-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Static contracts and documentation
        run: |
          python tools/test_improvements.py
          python tools/generate_source_reference.py --check
          python tools/verify_documentation.py
          git diff --check
      # Full archive verification also needs a local refs/archive backup not
      # published on origin. Never create or rewrite that historical reference.
      - name: Preserved source and manifests
        run: git diff --exit-code bb476180453c76f7d38e5b6a9f1f025ad2273ce0 -- '*.EnScript' docs/source-manifest.json docs/history-map.json
