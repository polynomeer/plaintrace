name: Branded browsers and Windows client
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  branded-ui:
    name: ${{ matrix.os }} / ${{ matrix.channel }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-11-arm, ubuntu-24.04, macos-14]
        channel: [chrome, msedge]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Set external result directory
        run: python -c "import os,pathlib; p=pathlib.Path(os.environ['RUNNER_TEMP'])/'branded-browser-results'; f=open(os.environ['GITHUB_ENV'],'a',encoding='utf-8'); f.write('PLAINTRACE_BROWSER_RESULTS='+str(p)+'\n'); f.close()"
      - name: Install workbench and test dependencies
        run: |
          python -m pip install .
          npm ci
      # Windows 11 ARM image already supplies vendor Chrome and Edge.
      - name: Install vendor stable browser
        if: matrix.os != 'windows-11-arm'
        run: npx playwright install --with-deps ${{ matrix.channel }}
      - name: Check actual client host
        if: matrix.os == 'windows-11-arm'
        shell: pwsh
        run: |
          $client = Get-CimInstance Win32_OperatingSystem
          if ($client.ProductType -ne 1 -or [int]$client.BuildNumber -lt 22000) { throw 'A real Windows 11 client is required' }
          $client | Select-Object Caption, Version, BuildNumber, ProductType, OSArchitecture | ConvertTo-Json | Set-Content -Encoding utf8 "$env:RUNNER_TEMP/windows-client.json"
      - name: Test installed workbench in branded channel
        run: npm run test:browser -- --project=${{ matrix.channel }}
      - name: Retain browser validation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: branded-${{ matrix.os }}-${{ matrix.channel }}
          path: |
            ${{ env.PLAINTRACE_BROWSER_RESULTS }}/
            ${{ runner.temp }}/windows-client.json
          if-no-files-found: error
          retention-days: 14
