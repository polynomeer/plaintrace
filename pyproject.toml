[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "plaintrace"
version = "0.8.0"
description = "Portable browser, LNK, Prefetch, EVTX Recycle Bin USB registry RecentDocs and application MRU and Jump List artifact analysis derived from Plain View of Multi Artifacts"
requires-python = ">=3.10"

[project.optional-dependencies]
evtx = ["python-evtx==0.8.1"]

[project.scripts]
plaintrace = "plaintrace.cli:main"

[tool.setuptools]
packages = ["plaintrace"]
