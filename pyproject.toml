[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "plaintrace"
version = "0.1.0"
description = "Portable browser SQLite artifact analysis derived from Plain View of Multi Artifacts"
requires-python = ">=3.10"

[project.scripts]
plaintrace = "plaintrace.cli:main"

[tool.setuptools]
packages = ["plaintrace"]
